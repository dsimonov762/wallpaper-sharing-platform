[project]
name = "catalog-service"
version = "0.1.0"
description = "Wallpaper Hub catalog-service (FastAPI, MongoDB)"
authors = [
    { name = "Dmytro Honchar", email = "dhonchar972@outlook.com" }
]
requires-python = ">=3.14.5"
dependencies = [
    "fastapi>=0.159.1",
    "httpx2>=2.16.0",
    "pydantic-settings>=2.16.1",
    "pymongo>=4.19.0",
    "python-ulid>=4.0.1",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/catalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-m 'not integration'"
markers = ["integration: needs a running MongoDB (run with just catalog-test-integration)"]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "N", "C4", "PT", "RUF", "FAST"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
typeCheckingMode = "strict"
pythonVersion = "3.14.5"
venvPath = "."
venv = ".venv"

[dependency-groups]
dev = [
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]
