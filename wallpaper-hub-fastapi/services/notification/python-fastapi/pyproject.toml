[project]
name = "notification-service"
version = "0.1.0"
description = "Wallpaper Hub notification-service (FastAPI, Redis as primary database)"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.159.1",
    "pydantic-settings>=2.16.1",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notification"]

[dependency-groups]
dev = [
    "httpx2>=2.16.0",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC", "S", "N", "C4", "PT", "RUF", "FAST"]
# Do not enable the TC rules: they move imports that FastAPI/Pydantic need at runtime.

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.pyright]
include = ["src", "tests"]
strict = ["src", "tests"]
pythonVersion = "3.14"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = ["integration: needs a running Redis (just infra-up)"]
