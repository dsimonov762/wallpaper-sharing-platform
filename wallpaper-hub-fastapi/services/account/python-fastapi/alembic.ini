[alembic]
script_location = %(here)s/migrations
prepend_sys_path = src
# 20261011_ab12cd34_create_users.py : sorts by date, readable in the file list
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
# The database URL is NOT here: migrations/env.py reads it from the same settings
# (ACCOUNT_DATABASE_URL) the service uses, so there is one source of truth.

[post_write_hooks]
# Tidy every newly generated migration with Ruff (fix imports, then format)
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME
